<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="30%" style="stop-color:#16213e"/>
      <stop offset="70%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0a2a5c"/>
    </radialGradient>
    
    <!-- Coin gradient -->
    <radialGradient id="coinGradient" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="30%" style="stop-color:#FFA500"/>
      <stop offset="70%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </radialGradient>
    
    <!-- Letter S gradient -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#FFF8DC"/>
      <stop offset="70%" style="stop-color:#F0E68C"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="145" fill="url(#bgGradient)" stroke="url(#coinGradient)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#coinGradient)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Middle ring -->
  <circle cx="150" cy="150" r="115" fill="none" stroke="url(#coinGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner coin area -->
  <circle cx="150" cy="150" r="100" fill="url(#coinGradient)" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- Inner ring -->
  <circle cx="150" cy="150" r="95" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.7"/>
  
  <!-- Sparkle stars -->
  <g fill="#FFD700" filter="url(#strongGlow)">
    <!-- Top stars -->
    <path d="M150 40 L152 47 L159 47 L154 51 L156 58 L150 54 L144 58 L146 51 L141 47 L148 47 Z" opacity="0.9"/>
    <path d="M200 80 L201 84 L205 84 L202 86 L203 90 L200 88 L197 90 L198 86 L195 84 L199 84 Z" opacity="0.7"/>
    <path d="M100 80 L101 84 L105 84 L102 86 L103 90 L100 88 L97 90 L98 86 L95 84 L99 84 Z" opacity="0.7"/>
    
    <!-- Side stars -->
    <path d="M260 150 L262 157 L269 157 L264 161 L266 168 L260 164 L254 168 L256 161 L251 157 L258 157 Z" opacity="0.8"/>
    <path d="M40 150 L42 157 L49 157 L44 161 L46 168 L40 164 L34 168 L36 161 L31 157 L38 157 Z" opacity="0.8"/>
    
    <!-- Bottom stars -->
    <path d="M150 260 L152 267 L159 267 L154 271 L156 278 L150 274 L144 278 L146 271 L141 267 L148 267 Z" opacity="0.9"/>
    <path d="M200 220 L201 224 L205 224 L202 226 L203 230 L200 228 L197 230 L198 226 L195 224 L199 224 Z" opacity="0.7"/>
    <path d="M100 220 L101 224 L105 224 L102 226 L103 230 L100 228 L97 230 L98 226 L95 224 L99 224 Z" opacity="0.7"/>
  </g>
  
  <!-- Main letter S -->
  <text x="150" y="185" 
        font-family="Impact, Arial Black, sans-serif" 
        font-size="120" 
        font-weight="900"
        text-anchor="middle" 
        fill="url(#letterGradient)" 
        stroke="#FFD700" 
        stroke-width="2"
        filter="url(#strongGlow)">S</text>
  
  <!-- Shine effects -->
  <ellipse cx="125" cy="125" rx="20" ry="35" fill="rgba(255,255,255,0.4)" transform="rotate(-45 125 125)" opacity="0.7"/>
  <ellipse cx="175" cy="175" rx="15" ry="25" fill="rgba(255,255,255,0.3)" transform="rotate(45 175 175)" opacity="0.5"/>
  
  <!-- Additional glow around S -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3" filter="url(#glow)"/>
  
</svg>